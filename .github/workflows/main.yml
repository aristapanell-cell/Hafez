name: Arista-hafez

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: faals.db
          key: faals-db-cache-v1-${{ runner.os }}
          restore-keys: |
            faals-db-cache-v1-
            faals-db-cache-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate DB
        run: |
          if [ ! -f faals.db ] || [ ! -s faals.db ] || [ "$(stat -c%s faals.db)" -lt 1000 ]; then
            echo "Invalid or missing database. Removing it..."
            rm -f faals.db
          fi

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
